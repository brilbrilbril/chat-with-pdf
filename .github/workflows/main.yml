name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cwp-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cwp-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cwp-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cwp-frontend:${{ github.sha }}

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yaml,docker-compose.prod.yaml"
          target: /opt/chat-with-pdf
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKER_USERNAME
          script: |
            cd /opt/chat-with-pdf

            docker pull ${{ secrets.DOCKER_USERNAME }}/cwp-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/cwp-frontend:latest

            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml \
              up -d --no-build

            docker exec cwp_backend python scripts/initdb.py

            docker image prune -f