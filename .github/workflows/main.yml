name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:latest
            ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            docker pull ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:latest

            docker stop chat-with-pdf || true
            docker rm chat-with-pdf || true

            docker run -d \
              --name chat-with-pdf \
              --restart always \
              -p 80:8000 \
              --env-file /opt/chat-with-pdf/.env \
              ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:latest

            docker image prune -f