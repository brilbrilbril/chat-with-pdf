name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:latest
            ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/chat-with-pdf

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:latest

            # Re-run with updated image (zero-downtime swap)
            docker stop chat-with-pdf || true
            docker rm chat-with-pdf || true

            docker run -d \
              --name chat-with-pdf \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/chat-with-pdf:latest

            # Run DB migrations
            docker exec chat-with-pdf python scripts/initdb.py

            # Clean up old images
            docker image prune -f
